name: Clear_Spokes

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:

  delete-spokes:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find Spokes To Delete
        shell: bash
        run: |
          set -euo pipefail

          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive!='true'].name" \
            -o tsv > spokes_to_delete.txt

          echo "Spokes marked for deletion:"
          cat spokes_to_delete.txt

      - name: Delete Non-KeepAlive Spokes
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max=5
            local delay=15
            local attempt=1

            while true; do
              "$@" && return 0

              if [ "$attempt" -ge "$max" ]; then
                echo "FAILED after $max attempts: $*" >&2
                return 1
              fi

              echo "Retry $attempt/$max: $*" >&2
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }

          ACCOUNT_KEY=$(az storage account keys list \
            --resource-group RG-Core-SBX \
            --account-name coresbxstorageaccount \
            --query "[0].value" \
            -o tsv)

          echo "ACCOUNT_KEY=$ACCOUNT_KEY" >> "$GITHUB_ENV"

          az storage blob download \
            --account-name coresbxstorageaccount \
            --account-key "$ACCOUNT_KEY" \
            --container-name spokeregcontainer \
            --name spokes.json \
            --file spokes.json

          while read RG; do
            [ -z "$RG" ] && continue

            spoke=$(echo "$RG" \
              | sed 's/^RG-Spoke-//' \
              | sed 's/-SBX$//')

            echo "Deleting spoke: $spoke"

            PEERING_NAME="hub-to-$spoke"

            PEERING_ID=$(az network vnet peering show \
              --resource-group RG-Hub-SBX \
              --vnet-name vnet-hub-sbx \
              --name "$PEERING_NAME" \
              --query id \
              -o tsv 2>/dev/null || true)

            if [ -n "$PEERING_ID" ]; then
              echo "Deleting peering: $PEERING_ID"
              retry az resource delete --ids "$PEERING_ID"
            fi

            retry az network private-dns link vnet delete \
              --resource-group RG-Hub-SBX \
              --zone-name privatelink.database.windows.net \
              --name "${spoke}-sql-link" \
              --yes

            retry az network private-dns link vnet delete \
              --resource-group RG-Hub-SBX \
              --zone-name privatelink.vaultcore.azure.net \
              --name "${spoke}-kv-link" \
              --yes

            retry az network private-dns link vnet delete \
              --resource-group RG-Hub-SBX \
              --zone-name privatelink.azurecr.io \
              --name "${spoke}-acr-link" \
              --yes

            retry az network private-dns link vnet delete \
              --resource-group RG-Hub-SBX \
              --zone-name privatelink.blob.core.windows.net \
              --name "${spoke}-storage-link" \
              --yes

            retry az network application-gateway rule delete \
              --gateway-name agw-sbx \
              --resource-group RG-Hub-SBX \
              --name "${spoke}-rule"

            retry az network application-gateway http-listener delete \
              --gateway-name agw-sbx \
              --resource-group RG-Hub-SBX \
              --name "${spoke}-listener"

            retry az network application-gateway http-settings delete \
              --gateway-name agw-sbx \
              --resource-group RG-Hub-SBX \
              --name "${spoke}-https"

            retry az network application-gateway address-pool delete \
              --gateway-name agw-sbx \
              --resource-group RG-Hub-SBX \
              --name "${spoke}-pool"

            retry az network private-dns record-set cname delete \
              --resource-group RG-Hub-SBX \
              --zone-name dar.internal \
              --name "$spoke" \
              --yes

            retry az group delete \
              --name "$RG" \
              --yes \
              --no-wait

            jq \
              --arg spoke "$spoke" \
              'del(.[$spoke])' \
              spokes.json > tmp.json

            mv tmp.json spokes.json

          done < spokes_to_delete.txt

      - name: Find Surviving KeepAlive Spokes
        shell: bash
        run: |
          set -euo pipefail

          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive=='true'].name" \
            -o tsv > spokes_to_reset.txt

          echo "Spokes surviving this cycle:"
          cat spokes_to_reset.txt

      - name: Reset KeepAlive Flag
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max=5
            local delay=15
            local attempt=1

            while true; do
              "$@" && return 0

              if [ "$attempt" -ge "$max" ]; then
                echo "FAILED after $max attempts: $*" >&2
                return 1
              fi

              echo "Retry $attempt/$max: $*" >&2
              attempt=$((attempt + 1))
              sleep "$delay"
            done
          }

          while read RG; do
            [ -z "$RG" ] && continue

            echo "Resetting keepalive tag on $RG"

            retry az group update \
              --name "$RG" \
              --set tags.keepalive=false

          done < spokes_to_reset.txt

      - name: Commit Updated Registry
        shell: bash
        run: |
          set -euo pipefail

          az storage blob upload \
            --overwrite true \
            --account-name coresbxstorageaccount \
            --account-key "$ACCOUNT_KEY" \
            --container-name spokeregcontainer \
            --name spokes.json \
            --file spokes.json
