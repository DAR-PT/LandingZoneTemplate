name: Clear_Spokes

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:

  delete-spokes:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find Spokes To Delete
        shell: bash
        run: |

          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive!='true'].name" \
            -o tsv > spokes_to_delete.txt

          echo "Spokes marked for deletion:"
          cat spokes_to_delete.txt

      - name: Delete Non-KeepAlive Spokes
        shell: bash
        run: |

            retry() {
              local max=5
              local delay=15
              local attempt=1

              while true; do
                "$@" && return 0

                if [ "$attempt" -ge "$max" ]; then
                  echo "FAILED after $max attempts"
                  return 1
                fi

                echo "Retry $attempt/$max"
                attempt=$((attempt + 1))
                sleep "$delay"
              done
            }

            delete_all_locks_in_group() {
              local rg="$1"

              echo "Deleting any locks on $rg"

              local lock_ids
              lock_ids=$(az lock list --resource-group "$rg" --query "[].id" -o tsv 2>/dev/null || true)

              if [ -z "$lock_ids" ]; then
                echo "No locks found on $rg"
                return 0
              fi

              while IFS= read -r lock_id; do
                [ -z "$lock_id" ] && continue
                echo "Deleting lock: $lock_id"
                retry az lock delete --ids "$lock_id" --yes || true
              done <<< "$lock_ids"
            }

            delete_all_resources_in_group() {
              local rg="$1"

              echo "Deleting all resources in $rg before deleting the spoke"

              local resource_ids
              resource_ids=$(az resource list --resource-group "$rg" --query "[?type!='Microsoft.Resources/resourceGroups'].id" -o tsv 2>/dev/null || true)

              if [ -z "$resource_ids" ]; then
                echo "No resources left in $rg"
                return 0
              fi

              while IFS= read -r resource_id; do
                [ -z "$resource_id" ] && continue

                if [[ "$resource_id" == *"/providers/Microsoft.Network/virtualNetworks/"* ]]; then
                  echo "Deleting VNet resource: $resource_id"
                  retry az network vnet delete --ids "$resource_id" || true
                  continue
                fi

                echo "Deleting resource: $resource_id"
                retry az resource delete --ids "$resource_id" || true
              done <<< "$resource_ids"
            }

            cleanup_hub_dependencies() {
              local spoke="$1"
              local peering_name="hub-to-${spoke}"

              echo "Checking hub-side dependencies for $spoke"

              local peering_id
              peering_id=$(az network vnet peering show \
                  --resource-group RG-Hub-SBX \
                  --vnet-name vnet-hub-sbx \
                  --name "$peering_name" \
                  --query id \
                  -o tsv 2>/dev/null || true)

              if [ -n "$peering_id" ]; then
                echo "Deleting peering: $peering_id"
                retry az resource delete --ids "$peering_id" || true
              fi

              retry az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name privatelink.database.windows.net \
                --name "${spoke}-sql-link" \
                --yes || true

              retry az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name privatelink.vaultcore.azure.net \
                --name "${spoke}-kv-link" \
                --yes || true

              retry az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name privatelink.azurecr.io \
                --name "${spoke}-acr-link" \
                --yes || true

              retry az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name privatelink.blob.core.windows.net \
                --name "${spoke}-storage-link" \
                --yes || true

              retry az network application-gateway rule delete \
                --gateway-name agw-sbx \
                --resource-group RG-Hub-SBX \
                --name "${spoke}-rule" || true

              retry az network application-gateway http-listener delete \
                --gateway-name agw-sbx \
                --resource-group RG-Hub-SBX \
                --name "${spoke}-listener" || true

              retry az network application-gateway http-settings delete \
                --gateway-name agw-sbx \
                --resource-group RG-Hub-SBX \
                --name "${spoke}-https" || true

              retry az network application-gateway address-pool delete \
                --gateway-name agw-sbx \
                --resource-group RG-Hub-SBX \
                --name "${spoke}-pool" || true

              retry az network private-dns record-set cname delete \
                --resource-group RG-Hub-SBX \
                --zone-name dar.internal \
                --name "$spoke" \
                --yes || true
            }

            ACCOUNT_KEY=$(az storage account keys list \
              --resource-group RG-Core-SBX \
              --account-name coresbxstorageaccount \
              --query "[0].value" \
              -o tsv)

            echo "ACCOUNT_KEY=$ACCOUNT_KEY" >> "$GITHUB_ENV"

            az storage blob download \
              --account-name coresbxstorageaccount \
              --account-key "$ACCOUNT_KEY" \
              --container-name spokeregcontainer \
              --name spokes.json \
              --file spokes.json

            while read RG; do
              [ -z "$RG" ] && continue

              spoke=$(echo "$RG" \
                | sed 's/^RG-Spoke-//' \
                | sed 's/-SBX$//')

              echo "Processing spoke: $spoke"

              delete_all_locks_in_group "$RG"
              delete_all_resources_in_group "$RG"
              cleanup_hub_dependencies "$spoke"

              retry az group delete \
                --name "$RG" \
                --yes \
                --no-wait || true

              jq \
                --arg spoke "$spoke" \
                'del(.[$spoke])' \
                spokes.json > tmp.json

              mv tmp.json spokes.json

            done < spokes_to_delete.txt

      - name: Find Surviving KeepAlive Spokes
        shell: bash
        run: |
          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive=='true'].name" \
            -o tsv > spokes_to_reset.txt

          echo "Spokes surviving this cycle:"
          cat spokes_to_reset.txt

      - name: Reset KeepAlive Flag
        shell: bash
        run: |
          retry() {
              local max=5
              local delay=15
              local attempt=1

              while true; do

              "$@" && return 0

              if [ "$attempt" -ge "$max" ]; then
                echo "FAILED after $max attempts"
                return 1
              fi

              echo "Retry $attempt/$max"
              attempt=$((attempt + 1))

              sleep $delay

              done
            }

          while read RG; do

            [ -z "$RG" ] && continue

            echo "Resetting keepalive tag on $RG"

            retry az group update \
              --name "$RG" \
              --set tags.keepalive=false

          done < spokes_to_reset.txt

      - name: Commit Updated Registry
        shell: bash
        run: |
           az storage blob upload \
              --overwrite true \
              --account-name coresbxstorageaccount \
              --account-key "$ACCOUNT_KEY" \
              --container-name spokeregcontainer \
              --name spokes.json \
              --file spokes.json
