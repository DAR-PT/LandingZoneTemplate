name: Create Spoke Repository

on:
  workflow_dispatch:
    inputs:

      spoke_name:
        description: Spoke Name
        required: true
        type: string

permissions:
  contents: read

jobs:

  create-repository:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Secret
        shell: bash
        env:
            GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT is empty or missing"
            exit 1
          fi
          echo "GH_PAT is present"
      - name: Debug GitHub Auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
            echo "Token present: $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
            gh auth status
      - name: Verify GitHub Auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          echo "Testing GitHub CLI"

          gh auth status

          gh repo view DAR-PT/LandingZoneTemplate
