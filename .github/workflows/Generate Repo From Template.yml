name: Create Spoke Repository
on:
  workflow_dispatch:
    inputs:
      spoke_name:
        description: Spoke Name
        required: true
        type: string
permissions:
  contents: write
jobs:
  create-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          SPOKE=$(echo "${{ github.event.inputs.spoke_name }}" | tr '[:upper:]' '[:lower:]')

          REPO="spoke-${SPOKE}"

          echo "Checking repository: DAR-PT/${REPO}"

          if gh repo view "DAR-PT/${REPO}" >/dev/null 2>&1
          then

            echo "Repository already exists"

            exit 1

          fi

          echo "Creating repository from template..."

          gh repo create "DAR-PT/${REPO}" \
            --private \
            --clone=false
            
          git clone https://github.com/DAR-PT/LandingZoneTemplate.git template
          git clone https://$GH_TOKEN@github.com/DAR-PT/${REPO}.git target

          cp -R template/. target/

          cd target

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Initial spoke repository"

          git push origin main
          
          echo "Repository created successfully"

          gh repo view "DAR-PT/${REPO}"
