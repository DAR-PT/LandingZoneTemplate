name: Create Spoke Repository

on:
  workflow_dispatch:
    inputs:

      spoke_name:
        description: Spoke Name
        required: true
        type: string

permissions:
  contents: read

jobs:

  create-repository:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |

          echo "Testing GitHub CLI"

          gh auth status

          gh repo view DAR-PT/LandingZoneTemplate
