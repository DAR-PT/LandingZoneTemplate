name: Delete Spokes

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:

  delete-spokes:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Find Spokes To Delete
        shell: bash
        run: |

          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive!='true'].name" \
            -o tsv > spokes_to_delete.txt

          echo "Spokes marked for deletion:"
          cat spokes_to_delete.txt

      - name: Delete Non-KeepAlive Spokes
        shell: bash
        run: |
          while read RG; do
            [ -z "$RG" ] && continue

            TEAM=$(echo "$RG" \
              | sed 's/^RG-Spoke-//' \
              | sed 's/-SBX$//')

            echo "Deleting team: $TEAM"

            PEERING_NAME="hub-to-$TEAM"

            az network vnet peering delete \
              --resource-group RG-Hub-SBX \
              --vnet-name vnet-hub-sbx \
              --name "$PEERING_NAME"
              
            for ZONE in \
                "privatelink.database.windows.net:${TEAM}-sql-link" \
                "privatelink.vaultcore.azure.net:${TEAM}-kv-link" \
                "privatelink.azurecr.io:${TEAM}-acr-link" \
                "privatelink.blob.core.windows.net:${TEAM}-storage-link"
            do
              DNS_ZONE=$(echo "$ZONE" | cut -d ':' -f1)
              LINK_NAME=$(echo "$ZONE" | cut -d ':' -f2)
              echo "Deleting DNS link: $LINK_NAME from zone $DNS_ZONE"

              az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name "$DNS_ZONE" \
                --name "$LINK_NAME" \
                --yes || true
              done
              
              az network private-dns link vnet delete \
                --resource-group RG-Hub-SBX \
                --zone-name "$DNS_ZONE" \
                --name "$LINK_NAME" \
                --yes || true
            done
              
            az group delete \
              --name "$RG" \
              --yes

            jq --arg team "$TEAM" \
              'del(.[$team])' \
              teams.json > tmp.json

            mv tmp.json teams.json

          done < spokes_to_delete.txt

      - name: Find Surviving KeepAlive Spokes
        shell: bash
        run: |

          az group list \
            --query "[?contains(name, 'RG-Spoke-') && tags.keepalive=='true'].name" \
            -o tsv > spokes_to_reset.txt

          echo "Spokes surviving this cycle:"
          cat spokes_to_reset.txt

      - name: Reset KeepAlive Flag
        shell: bash
        run: |

          while read RG; do

            [ -z "$RG" ] && continue

            echo "Resetting keepalive tag on $RG"

            az group update \
              --name "$RG" \
              --set tags.keepalive=false

          done < spokes_to_reset.txt

      - name: Commit Updated Registry
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add teams.json

          git commit -m "Nightly spoke cleanup" || exit 0

          git push
