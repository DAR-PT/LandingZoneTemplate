name: Build Container

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: container
        shell: bash
        run: |
          if [ -f Dockerfile ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Container build skipped: no root Dockerfile is present."
          fi

      - name: Set up Docker Buildx
        if: steps.container.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build container image for pull request
        if: steps.container.outputs.available == 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: landing-zone-template:${{ github.sha }}

      - name: Log in to Azure
        if: steps.container.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: steps.container.outputs.available == 'true' && github.event_name != 'pull_request'
        run: az acr login --name coresbxacr

      - name: Upload container to Azure Container Registry
        if: steps.container.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            coresbxacr.azurecr.io/landing-zone-template:${{ github.sha }}
            coresbxacr.azurecr.io/landing-zone-template:latest
