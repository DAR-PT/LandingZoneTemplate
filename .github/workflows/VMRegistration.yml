name: Create VM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:

  register:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create VM
        shell: bash
        run: |

          SPOKE="${GITHUB_REPOSITORY#*/}"
          SPOKE="${SPOKE#spoke-}"

          echo "SPOKE=$SPOKE" >> $GITHUB_ENV

          VM_NAME="${SPOKE}-vm"

          echo "VM_NAME=$VM_NAME" >> $GITHUB_ENV

          az vm create \
            --resource-group "RG-Spoke-${SPOKE}-SBX" \
            --name "$VM_NAME" \
            --image Ubuntu2204 \
            --admin-username azureuser \
            --generate-ssh-keys

      - name: Get Endpoint
        shell: bash
        run: |

          TARGET=$(az vm show \
            --resource-group "RG-Spoke-${SPOKE}-SBX" \
            --name "$VM_NAME" \
            --show-details \
            --query privateIps \
            -o tsv)

          echo "TARGET=$TARGET" >> $GITHUB_ENV

          echo "Endpoint: $TARGET"

      - name: Update Registry
        shell: bash
        run: |

          if [ ! -f applications.json ]; then
            echo '{}' > applications.json
          fi

          jq \
            --arg spoke "$SPOKE" \
            --arg ip "$TARGET" \
            '. + {
               ($spoke): {
                  type: "vm",
                  ip: $ip
                }
            }' \
          applications.json > tmp.json

          mv tmp.json applications.json

      - name: Register VM
        shell: bash
        run: |

          retry() {
              local max=5
              local delay=15
              local attempt=1

              while true; do
                "$@" && return 0
                if [ "$attempt" -ge "$max" ]; then
                  echo "FAILED after $max attempts"
                  return 1
                fi
                echo "Retry $attempt/$max"
                attempt=$((attempt + 1))
                sleep $delay
              done
            }

            echo "Registering:"
            echo "${SPOKE}.dar.internal"
            echo " -> ${TARGET}"

            retry az network private-dns record-set a create \
              --resource-group RG-Hub-SBX \
              --zone-name dar.internal \
              --name "$SPOKE" || true

            retry az network private-dns record-set a update \
              --resource-group RG-Hub-SBX \
              --zone-name dar.internal \
              --name "$SPOKE" \
              --set aRecords=[] || true

            retry az network private-dns record-set a add-record \
              --resource-group RG-Hub-SBX \
              --zone-name dar.internal \
              --record-set-name "$SPOKE" \
              --ipv4-address "$TARGET"

      - name: Update Backend Pool
        shell: bash
        run: |

           retry az network application-gateway address-pool update \
              --gateway-name agw-sbx \
              --resource-group RG-Hub-SBX \
              --name "${SPOKE}-pool" \
              --servers "$TARGET"

      - name: Commit Registry
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add applications.json

          git commit -m "Register application for $SPOKE" || exit 0

          git push
